[project]
name = "adrobot"
version = "0.1.0"
description = "Campaign creator and offer editor for Keitaro"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.3,<4",
    "pycountry>=26.2,<27",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.13,<3",
    "sqlalchemy[asyncio]>=2.0.48,<2.1",
    "starlette>=1.0,<2",
    "uvicorn>=0.41,<1",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pip-audit>=2.10,<3",
    "playwright>=1.56,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["adrobot"]

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]

[tool.pytest]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
